<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Update - BakeStock</title>
    <link rel="stylesheet" href="add-stockupdate.css"> </head>
<body>

<div class="sidebar">
    <h2>BakeStock</h2>
    <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="product.html">Products</a></li>
        <li><a href="add-product.html">Add Product</a></li>
        <li><a href="add-stockupdate.html" class="active">Stock Update</a></li>
    </ul>
</div>

<div class="main-content">
    <header>
        <h1>Update Stock Levels</h1>
        <p>Select a product to modify its current quantity.</p>
    </header>

    <div class="form-box">
        <div class="input-group">
            <label for="productSelect">Select Product</label>
            <select id="productSelect">
                <option value="">-- Loading Products --</option>
            </select>
        </div>

        <div class="input-group">
            <label for="newStock">New Stock Quantity</label>
            <input type="number" id="newStock" placeholder="Enter new total">
        </div>

        <button id="updateBtn">Update Inventory</button>
    </div>
    
    <div id="statusMessage"></div>
</div>

<script src="add-stockupdate.js"></script>

</body>
</html>
